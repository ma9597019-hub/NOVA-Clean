<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم مشروع NOVA Clean</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ملف الـ CSS الأساسي -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- الشريط الجانبي (تمت إزالة قسم الرسائل منه نهائياً) -->
        <aside class="sidebar">
            <h2>NOVA Clean</h2>
            <ul class="nav-links">
                <li><a href="#dashboard" class="active">الرئيسية</a></li>
                <li><a href="#tasks">المهام</a></li>
                <li><a href="#components">المكونات</a></li>
                <li><a href="#expenses">المصروفات</a></li>
                <li><a href="#attendance" id="nav-attendance">الغياب والحضور</a></li>
                <li><a href="#tests">الاختبارات</a></li>
            </ul>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">
            <!-- قسم الغياب والحضور الجديد -->
            <section id="attendance-section" class="content-section">
                <h2>قسم الغياب والحضور للمقابلات</h2>
                
                <!-- لوحة الإحصائيات -->
                <div class="stats-cards">
                    <div class="card">حاضر: <span id="count-present">0</span></div>
                    <div class="card">غائب: <span id="count-absent">0</span></div>
                    <div class="card">متأخر: <span id="count-late">0</span></div>
                    <div class="card">غياب بعذر: <span id="count-excused">0</span></div>
                </div>

                <!-- نموذج وسائط البحث والإضافة -->
                <div class="controls-bar">
                    <input type="text" id="search-member" placeholder="بحث بالاسم..." oninput="filterAttendance()">
                    <input type="date" id="filter-date" onchange="filterAttendance()">
                </div>

                <!-- جدول الحضور والغياب -->
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>التاريخ</th>
                            <th>اسم العضو</th>
                            <th>الحالة</th>
                            <th>ملاحظات</th>
                            <th>بواسطة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-tbody">
                        <!-- يتم تعبئتها ديناميكياً من الجافاسكريبت -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- ملف السكريبت الرئيسي -->
    <script src="app.js"></script>
</body>
</html>
