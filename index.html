<style>
/* ===== VIP SUPERVISORS SYSTEM CSS ===== */
.vip-wrap{direction:rtl;padding:0;animation:vipFadeIn .4s ease}
@keyframes vipFadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* Hero Banner */
.vip-hero{background:linear-gradient(135deg,#0a1433 0%,#1e3a8a 50%,#0a1433 100%);border-radius:20px;padding:32px 28px;margin-bottom:20px;position:relative;overflow:hidden;border:1px solid #2563eb44}

.vip-hero-inner{position:relative;z-index:1;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.vip-hero-icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#2563eb,#06b6d4);display:grid;place-items:center;font-size:28px;flex-shrink:0;box-shadow:0 0 32px #2563eb55}

.vip-hero-text p{margin:0;color:#93c5fd;font-size:14px}
.vip-hero-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.vip-cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:20px}
.vip-sup-card{background:linear-gradient(160deg,#0f1f4b 0%,#0a1433 100%);border:1px solid #2563eb33;border-radius:18px;padding:24px;position:relative;overflow:hidden;cursor:default;transition:transform .25s,box-shadow .25s,border-color .25s}

.dev-card .vip-sup-avatar{background:linear-gradient(135deg,#8b5cf6,#ec4899);box-shadow:0 0 24px #8b5cf644;border-color:#8b5cf655}

.dev-card .vip-vip-badge{background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#ddd6fe}

.vip-stat-item span{font-size:11px;color:#64748b}

.vip-dashboard{background:#0a1433;border:1px solid #1e3a8a55;border-radius:18px;overflow:hidden;margin-bottom:20px}

.vip-kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}

.vip-mem-table{width:100%;border-collapse:collapse;font-size:13px}

.vip-prog-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#2563eb,#22c55e)}
/* Tabs */
.vip-tabs{display:flex;gap:4px;padding:4px;background:#0a1433;border-radius:10px;margin-bottom:16px;flex-wrap:wrap}

<script>
/* ===== Supabase layer: Auth bridge + Private Storage + kv database + AI proxy ===== */
var SB={c:null,sess:null,bucket:"project-images",ttl:3600,slug:"",role:""};
var SBM={exp:"انتهت الجلسة. سجّل الدخول من جديد ثم أعد المحاولة.",perm:"ليست لديك صلاحية لهذه العملية على الصور (سياسات Supabase رفضتها).",net:"تعذّر الاتصال بـ Supabase. تحقق من الإنترنت ثم أعد المحاولة.",big:"حجم الملف يتجاوز الحد المسموح (8 ميجا).",nob:"الـ Bucket «project-images» غير موجود. شغّل ملف supabase/setup.sql أولًا."};
var PH="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==",SU={},SQ={},SQT=null;

async function sbRestore(){try{var g=await SB.c.auth.getSession(),x=g.data&&g.data.session;if(!x)return;
 var am=x.user.app_metadata||{},un=(x.user.user_metadata||{}).username,sv={};
 try{sv=JSON.parse(localStorage.getItem("sbme")||"{}")||{}}catch(e){}
 if(!am.member||!un)return;SB.sess=x;SB.slug=am.slug;SB.role=am.role;
 own=am.role=="owner";
 me=(own&&sv.me&&(everyone().indexOf(sv.me)>=0||sv.me=="المالك"))?sv.me:un}catch(e){console.warn(e)}}
function SBR(){return !!(SB.c&&SB.sess)}
async function sbInit(){
 if(!window.supabase)throw new Error("تعذّر تحميل مكتبة Supabase");
 var r=await fetch("/api/config",{cache:"no-store"});if(!r.ok)throw new Error("تعذّر قراءة /api/config");
 var c=await r.json();if(!c.url||!c.key)throw new Error("متغيرات Supabase غير مضبوطة في Vercel");
 SB.c=supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 SB.c.auth.onAuthStateChange(function(ev,s){SB.sess=s;if(ev=="SIGNED_OUT")SU={};if(SB.refresh)SB.refresh()})}
async function sbLogin(u,p){var r;
 try{r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})})}catch(e){throw new Error(SBM.net)}
 var j={};try{j=await r.json()}catch(e){}
 if(!r.ok||!j.session){var er=new Error(j.error||"تعذّر إنشاء جلسة Supabase ("+r.status+")");er.code=r.status;throw er}
 var s=await SB.c.auth.setSession({access_token:j.session.access_token,refresh_token:j.session.refresh_token});
 if(s.error||!s.data.session)throw new Error("رفض Supabase الجلسة: "+(s.error&&s.error.message||""));
 SB.sess=s.data.session;SB.slug=j.slug;SB.role=j.role;SB.name=j.name;SU={};if(SB.refresh)SB.refresh();return j.name}
async function sbOut(){try{localStorage.removeItem("sbme")}catch(e){}try{if(SB.c)await SB.c.auth.signOut()}catch(e){}SB.sess=null;SU={}}
async function sbSess(){var g=await SB.c.auth.getSession(),s=g.data&&g.data.session;if(!s)throw new Error(SBM.exp);return s}
function upMsg(e){var m=((e&&e.message)||"")+"",c=+(e&&(e.statusCode||e.status))||0;
 if(/jwt|expired|invalid token/i.test(m)||c==401)return SBM.exp;
 if(/row-level|policy|not authorized|unauthorized/i.test(m)||c==403)return SBM.perm;
 if(/bucket not found/i.test(m)||c==404&&/bucket/i.test(m))return SBM.nob;
 if(/exceed|too large|payload/i.test(m)||c==413)return SBM.big;
 if(/mime|not supported/i.test(m))return"نوع الملف غير مقبول";
 if(/failed to fetch|network/i.test(m))return SBM.net;return m||"خطأ غير معروف"}
function isPath(p){return typeof p=="string"&&p.indexOf("/")>0}
/* signed URLs: cached, batched, refreshed before expiry */
function su(p){if(!isPath(p))return PH;var e=SU[p];if(e&&e.x>Date.now())return e.u;sqAdd(p);return PH}
function sqAdd(p){if(!SB.sess)return;SQ[p]=1;clearTimeout(SQT);SQT=setTimeout(sqRun,40)}
async function sqRun(){var ps=Object.keys(SQ);SQ={};if(!ps.length||!SB.sess)return;
 try{var r=await SB.c.storage.from(SB.bucket).createSignedUrls(ps,SB.ttl);if(r.error){console.warn(r.error);return}
  r.data.forEach(function(o){if(o.signedUrl&&o.path)SU[o.path]={u:o.signedUrl,x:Date.now()+(SB.ttl-300)*1000}});hyd()}catch(e){console.warn(e)}}
function hyd(){document.querySelectorAll("[data-sp]").forEach(function(n){var e=SU[n.getAttribute("data-sp")];if(!e)return;var a=n.tagName=="A"?"href":"src";if(n.getAttribute(a)!=e.u)n.setAttribute(a,e.u)})}
setInterval(function(){document.querySelectorAll("[data-sp]").forEach(function(n){var p=n.getAttribute("data-sp"),e=SU[p];if(isPath(p)&&(!e||e.x<Date.now()+120000))sqAdd(p)})},120000);
document.addEventListener("error",function(ev){var n=ev.target;if(n&&n.getAttribute&&n.getAttribute("data-sp")&&!n.dataset.rt){n.dataset.rt=1;var p=n.getAttribute("data-sp");delete SU[p];sqAdd(p)}},true);
new MutationObserver(function(){hyd()}).observe(document.documentElement,{childList:true,subtree:true});
/* upload / delete (real Supabase Storage, user session only) */
async function upImg(b,cat){
 var er=await chkImg(b);if(er)throw new Error(er);
 var k=await kind(b),ext=k=="image/png"?"png":k=="image/webp"?"webp":"jpg",s=await sbSess();
 var slug=s.user.app_metadata&&s.user.app_metadata.slug;if(!slug)throw new Error(SBM.perm);
 var path=slug+"/"+String(cat||"misc").replace(/[^a-z0-9_-]/gi,"")+"/"+(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2))+"."+ext;
 var st=SB.c.storage.from(SB.bucket),r;
 try{r=await st.upload(path,b,{contentType:k,cacheControl:"3600",upsert:false})}catch(e){throw new Error(upMsg(e))}
 if(r.error)throw new Error(upMsg(r.error));
 if(!r.data||!r.data.path)throw new Error("لم يؤكد Supabase نجاح الرفع");
 var v=await st.createSignedUrl(path,SB.ttl);
 if(v.error||!v.data){try{await st.remove([path])}catch(e){}throw new Error("تعذّر تأكيد وجود الصورة بعد الرفع: "+upMsg(v.error))}
 SU[path]={u:v.data.signedUrl,x:Date.now()+(SB.ttl-300)*1000};return{id:path}}
async function delStored(p,strict){
 if(!isPath(p))return true;
 try{await sbSess();var st=SB.c.storage.from(SB.bucket),r=await st.remove([p]);
  if(r.error)throw r.error;
  if(!r.data||!r.data.length){var v=await st.createSignedUrl(p,10);if(v.error&&/not.?found|object/i.test(v.error.message||""))return true;var x=new Error("لا تملك صلاحية حذف هذه الصورة");x.own=1;throw x}
  delete SU[p];return true}
 catch(e){console.error("[delStored] فشل حذف الملف من Storage:",p,e);if(strict)throw new Error(e&&e.own?e.message:upMsg(e));return false}}
/* kv database with the same interface the app already uses (collection/doc/onSnapshot) */
function sbDb(){var L=[];
 function load(c,cb){return SB.c.from("kv").select("id,data").eq("collection",c).then(function(r){if(r.error){console.warn(r.error.message);return}cb({docs:r.data.map(function(x){return{id:x.id,data:function(){return x.data}}})})})}
 SB.refresh=function(){L.forEach(function(l){load(l.c,l.cb)})};
 SB.reload=function(c){return Promise.all(L.filter(function(l){return l.c==c}).map(function(l){return load(l.c,l.cb)}))};
 SB.c.channel("kv-ch").on("postgres_changes",{event:"*",schema:"public",table:"kv"},function(p){var c=(p.new&&p.new.collection)||(p.old&&p.old.collection);L.forEach(function(l){if(!c||l.c==c)load(l.c,l.cb)})}).subscribe();
 function chk(r){if(r&&r.error){var e=new Error(r.error.message);e.code=r.error.code||r.error.message;throw e}}
 return{collection:function(c){return{doc:function(id){return{
  set:function(x){var row={collection:c,id:id,data:x,updated_at:new Date().toISOString()},q=SB.sess?SB.c.from("kv").upsert(row):SB.c.from("kv").insert(row);return q.then(chk)},
  delete:function(){
   /* ROOT-CAUSE FIX: بدون select() يرجع Supabase نجاحًا (بلا خطأ) حتى لو حذف 0 صف بسبب RLS.
      هنا نطلب الصفوف المحذوفة فعليًا ونتحقق منها، ثم نعيد فحص قاعدة البيانات للتأكد من اختفاء السجل. */
   return SB.c.from("kv").delete().eq("collection",c).eq("id",id).select("id").then(function(r){
    chk(r);
    if(r.data&&r.data.length)return true;
    return SB.c.from("kv").select("id").eq("collection",c).eq("id",id).maybeSingle().then(function(v){
     chk(v);
     if(v.data){var e=new Error("رفضت سياسات Supabase (RLS) حذف هذا السجل — ليست لديك صلاحية الحذف");e.code="RLS_DENIED";throw e}
     return true})})}}},
  onSnapshot:function(cb){var l={c:c,cb:cb};L.push(l);load(c,cb);return function(){var i=L.indexOf(l);if(i>=0)L.splice(i,1)}}}}}}
/* AI inspection through the secured /api/analyze (key stays on the server) */
function b2b64(f){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(String(r.result).split(",")[1])};r.onerror=function(){no(new Error("تعذّر قراءة الصورة"))};r.readAsDataURL(f)})}
function sbAI(){var f=async function(q,o){var s=await sbSess(),im=((o&&o.images)||[])[0],body={prompt:q};
  if(im){body.image=await b2b64(im);body.media=(await kind(im))||im.type}
  var r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+s.access_token},body:JSON.stringify(body)}),j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||"فشل فحص الذكاء الاصطناعي ("+r.status+")");return{text:j.text||""}};
 f.limits=async function(){try{var j=await (await fetch("/api/analyze",{cache:"no-store"})).json();return{images:!!j.images}}catch(e){return{images:false}}};return f}

/* أسعار المكونات: مصدرها مجموعة prices وتُدمج في بيانات المكونات قبل كل عرض */

/* مساهمات الأعضاء: مجموعة mcost، مستند لكل عضو */
function mcMembers(){return MEM.filter(function(n){return MC_EXCL.indexOf(n)<0})}
function mcOf(n){return D.mcost.filter(function(x){return x.id==n})[0]||{id:n,due:null,pays:[],log:[]}}
function mcPaid(m){return (m.pays||[]).reduce(function(a,p){return a+(+p.a||0)},0)}
function mcSt(m){var pd=mcPaid(m),du=m.due;
 if(du==null)return{k:"nd",t:"لم يُحدَّد المطلوب",c:"s-b",o:3};
 if(pd>du)return{k:"ov",t:"زائد عن المطلوب",c:"s-p",o:4};
 if(pd==du)return{k:"ok",t:"مكتمل",c:"s-d",o:0};
 if(pd==0)return{k:"no",t:"لم يدفع",c:"s-n",o:1};
 return{k:"pt",t:"دفع جزءًا",c:"s-b",o:2}}
function mcSave(n,patch,t){var m=mcOf(n);
 return put("mcost",Object.assign({},m,patch,{id:n,log:(m.log||[]).concat([{ts:Date.now(),by:me||"",t:t}])}))}
function mcNum(v){var s=String(v==null?"":v).trim();if(s==="")return NaN;var n=Number(s);return isFinite(n)?n:NaN}

 var n=mcMembers()[i];if(!n)return;

 if(v!==null&&(isNaN(v)||v<0)){toast("أدخل مبلغًا صحيحًا (صفر أو أكبر)");return}
 mcSave(n,{due:v},"حدّد المطلوب من «"+n+"»: "+(v==null?"غير محدد":fm(v)+EG));
 closeM();toast("تم حفظ المطلوب ✓")}

       +'</div>'
       +'<button class="btn" type="submit">تسجيل</button>'
       +'</form></div>';
    }
  }

  /* ===== قسم أعضاء الفريق: عرض بخصوصية مع زر «المزيد» ===== */
  /* الترتيب عشوائي لكل عضو لا يرى إلا نفسه — المشرف يرى الجميع */
  var allMems=attMembers();

     +(rate!==null?' · حضور: '+rate+'٪':'')

     +'</div>'});

   h+='<p class="note" style="text-align:center">لا توجد سجلات حضور بعد.</p>';
  }
  h+='</div>';

  /* ===== جدول كامل للمشرفين فقط مع فلاتر ===== */
  if(adm){
   var dates=[];
   D.attendance.forEach(function(r){if(r.meeting_date&&dates.indexOf(r.meeting_date)<0)dates.push(r.meeting_date)});
   dates.sort(function(a,b){return b>a?1:-1});
   h+='<div class="card"><div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">'
    +'<h3 style="margin:0">📋 السجل الكامل (للمشرفين) — '+fm(D.attendance.length)+' سجل</h3></div>'
    +'<div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">'
    +'<select onchange="ATT_F.date=this.value;go()"><option value="">كل التواريخ</option>'
    +dates.map(function(d){return'<option'+(ATT_F.date==d?' selected':'')+' value="'+d+'">'+d+'</option>'}).join("")+'</select>'

    +'<select onchange="ATT_F.status=this.value;go()"><option value="">كل الحالات</option>'
    +'<option value="present"'+(ATT_F.status=="present"?" selected":"")+'>✅ حاضر</option>'
    +'<option value="absent"'+(ATT_F.status=="absent"?" selected":"")+'>❌ غائب</option>'
    +'<option value="late"'+(ATT_F.status=="late"?" selected":"")+'>🕐 متأخر</option>'
    +'<option value="excused"'+(ATT_F.status=="excused"?" selected":"")+'>📋 بعذر</option>'
    +'</select></div>'
    +'<div class="wrap"><table class="tbl"><thead><tr>'
    +'<th>تاريخ المقابلة</th><th>العضو</th><th>الحالة</th><th>ملاحظات</th><th>سجّله</th><th>وقت التسجيل</th><th></th>'
    +'</tr></thead><tbody id="att-list">'+attListHtml()+'</tbody></table></div>'
    +'</div>';
  }

  return h

/* عدد السجلات لتاريخ معين */
function attDateCount(d){return D.attendance.filter(function(r){return r.meeting_date==d}).length}

/* تحديد تاريخ المقابلة المختار */
function attPickDate(v){
  var inp=$("att_date_new"),sel=$("att_date_pick");
  if(!v)return;
  /* نزامن المدخلَين */
  if(inp&&v.match(/^\d{4}-\d{2}-\d{2}$/))inp.value=v;
  if(sel){var opt=sel.querySelector('option[value="'+v+'"]');if(!opt){sel.value=""}}
}

function attSetDate(){
  var sel=$("att_date_pick"),inp=$("att_date_new");
  var v=(sel&&sel.value)||(inp&&inp.value)||"";
  if(!v){toast("اختر موعد المقابلة أو أدخل تاريخًا جديدًا");return}
  if(!v.match(/^\d{4}-\d{2}-\d{2}$/)){toast("صيغة التاريخ غير صحيحة (YYYY-MM-DD)");return}
  ATT_SEL_DATE=v;
  ATT_BATCH={};
  go()
}

/* تسجيل سريع لعضو واحد */
function attQuickReg(member){
  if(!isAttAdmin()){toast("التسجيل مقتصر على المصرح لهم فقط");return}
  if(!ATT_SEL_DATE){toast("حدد موعد المقابلة أولًا");return}
  var stOpts=Object.keys(ATT_STATUS).map(function(k){return'<option value="'+k+'">'+ATT_STATUS_ICON[k]+' '+ATT_STATUS[k]+'</option>'}).join("");
  modal('<div class="bgm-modal"><div class="bgm-head"><h3 style="margin:0">تسجيل حضور</h3></div>'

   +'<label class="note">تاريخ المقابلة<input value="'+esc(ATT_SEL_DATE)+'" disabled></label>'
   +'<label class="note">حالة الحضور<select id="attq_status"><option value="">— اختر —</option>'+stOpts+'</select></label>'
   +'<label class="note">ملاحظات<input id="attq_notes" placeholder="اختياري"></label>'
   +'</div>'
   +'<div class="bgm-foot"><button class="btn" onclick="attQuickSave(\''+esc(member)+'\')">حفظ</button>'
   +'<button class="btn g" onclick="closeM()">إلغاء</button></div></div>')
}

async function attQuickSave(member){
  if(!isAttAdmin())return;
  var status=$("attq_status").value,notes=($("attq_notes")?$("attq_notes").value.trim():"");
  if(!status){toast("اختر حالة الحضور");return}
  var dup=attRecordOf(ATT_SEL_DATE,member);
  if(dup){toast("هذا العضو مسجّل بالفعل. استخدم زر تعديل.");return}
  var o={id:"att"+Date.now()+Math.floor(Math.random()*99),meeting_date:ATT_SEL_DATE,member_name:member,status:status,notes:notes,recorded_by:me||"",created_at:Date.now(),updated_at:Date.now()};
  var ok=await put("attendance",o);
  if(ok){act("👥 سجّل حضور «"+member+"» في مقابلة "+ATT_SEL_DATE+": "+ATT_STATUS[status]);closeM();toast("تم التسجيل ✓")}
}

/* حفظ جماعي */
async function attBatchSave(){
  if(!isAttAdmin()){toast("التسجيل مقتصر على المصرح لهم فقط");return}
  if(!ATT_SEL_DATE){toast("حدد موعد المقابلة أولًا");return}
  var rows=document.querySelectorAll(".att-batch-s");
  var toSave=[];
  rows.forEach(function(sel){
    var n=sel.getAttribute("data-m"),v=sel.value;
    if(!v)return;
    var noteEl=document.querySelector('.att-batch-n[data-m="'+n+'"]');
    var note=noteEl?noteEl.value.trim():"";
    toSave.push({member:n,status:v,notes:note});
  });
  if(!toSave.length){toast("لم تختر حالة لأي عضو");return}
  var saved=0,skipped=0;
  for(var i=0;i<toSave.length;i++){
    var item=toSave[i];
    var dup=attRecordOf(ATT_SEL_DATE,item.member);
    if(dup){skipped++;continue}
    var o={id:"att"+Date.now()+(i*7)+Math.floor(Math.random()*99),meeting_date:ATT_SEL_DATE,member_name:item.member,status:item.status,notes:item.notes,recorded_by:me||"",created_at:Date.now(),updated_at:Date.now()};
    var ok=await put("attendance",o);
    if(ok){saved++;act("👥 سجّل «"+item.member+"» في "+ATT_SEL_DATE+": "+ATT_STATUS[item.status])}
  }
  if(saved)toast("✓ تم حفظ "+saved+" سجل"+(skipped?" (تخطّي "+skipped+" مكرر)":""));
  else toast("لم يُحفظ شيء"+(skipped?" — الأعضاء مسجّلون بالفعل":""));
  go()
}

function attBatchClear(){
  document.querySelectorAll(".att-batch-s,.att-batch-n").forEach(function(el){el.value=""})
}

function attFiltered(){
  return D.attendance.filter(function(r){
    /* غير المشرفين لا يرون إلا سجلاتهم الخاصة */
    if(!isAttAdmin()&&r.member_name!==me)return false;
    if(ATT_F.date&&r.meeting_date!=ATT_F.date)return false;
    if(ATT_F.member&&(r.member_name||"").indexOf(ATT_F.member)<0)return false;
    if(ATT_F.status&&r.status!=ATT_F.status)return false;
    return true}).sort(function(a,b){return (b.meeting_date>a.meeting_date?1:b.meeting_date<a.meeting_date?-1:0)||(b.created_at||0)-(a.created_at||0)})
}

function attListHtml(){
  var adm=isAttAdmin(),L=attFiltered();
  if(!L.length)return'<tr><td colspan="7" class="note" style="text-align:center;padding:20px">لا توجد سجلات مطابقة.</td></tr>';
  return L.slice(0,200).map(function(r){
    return'<tr><td>'+esc(r.meeting_date||"—")+'</td>'
     +'<td><b>'+esc(r.member_name||"—")+'</b></td>'
     +'<td><span class="pill '+ATT_STATUS_CSS[r.status]+'">'+esc((ATT_STATUS_ICON[r.status]||"")+" "+(ATT_STATUS[r.status]||r.status))+'</span></td>'
     +'<td>'+esc(r.notes||"—")+'</td>'
     +'<td>'+esc(r.recorded_by||"—")+'</td>'
     +'<td><small>'+dt(r.created_at||0)+'</small></td>'
     +(adm?'<td style="white-space:nowrap"><button class="pill s-b" onclick="attEdit(\''+r.id+'\')">تعديل</button> <button class="pill s-n" onclick="attDel(\''+r.id+'\')">حذف</button></td>':'')
     +'</tr>'}).join("")
}

function attList(){var b=$("att-list");if(b)b.innerHTML=attListHtml()}

async function attAdd(e){
  e.preventDefault();
  if(!isAttAdmin()){toast("تسجيل الحضور مقتصر على المصرح لهم فقط");return}
  var date=ATT_SEL_DATE||($("att_date")&&$("att_date").value);
  var member=$("att_member").value,status=$("att_status").value,notes=$("att_notes").value.trim();
  if(!date){toast("حدد موعد المقابلة أولًا");return}
  if(!member){toast("اختر العضو");return}
  if(!status){toast("اختر حالة الحضور");return}
  var dup=attRecordOf(date,member);
  if(dup){if(!confirm("هذا العضو مسجّل بالفعل في هذه المقابلة بحالة «"+ATT_STATUS[dup.status]+"». هل تريد تعديل السجل الحالي؟")){return}attEditPrompt(dup.id);return}
  var o={id:"att"+Date.now()+Math.floor(Math.random()*99),meeting_date:date,member_name:member,status:status,notes:notes,recorded_by:me||"",created_at:Date.now(),updated_at:Date.now()};
  var ok=await put("attendance",o);
  if(ok){act("👥 سجّل حضور «"+member+"» في مقابلة "+date+": "+ATT_STATUS[status]);toast("تم التسجيل ✓");$("att_member").value="";$("att_status").value="";if($("att_notes"))$("att_notes").value=""}
}

function attEdit(id){
  if(!isAttAdmin()){toast("التعديل مقتصر على المصرح لهم فقط");return}
  var r=D.attendance.filter(function(x){return x.id==id})[0];if(!r)return;
  attEditPrompt(id,r)
}

function attEditPrompt(id,r){
  if(!r)r=D.attendance.filter(function(x){return x.id==id})[0];if(!r)return;
  var stOpts=Object.keys(ATT_STATUS).map(function(k){return'<option value="'+k+'"'+(k==r.status?' selected':'')+'>'+ATT_STATUS_ICON[k]+' '+ATT_STATUS[k]+'</option>'}).join("");
  modal('<div class="bgm-modal"><div class="bgm-head"><h3 style="margin:0">تعديل سجل حضور</h3></div>'
   +'<div class="bgm-body">'
   +'<label class="note">العضو<input value="'+esc(r.member_name||"")+'" disabled></label>'
   +'<label class="note">تاريخ المقابلة<input value="'+esc(r.meeting_date||"")+'" disabled></label>'
   +'<label class="note">حالة الحضور<select id="att_e_status">'+stOpts+'</select></label>'
   +'<label class="note">ملاحظات<input id="att_e_notes" value="'+esc(r.notes||"")+'"></label>'
   +'</div>'
   +'<div class="bgm-foot"><button class="btn" onclick="attSaveEdit(\''+id+'\')">حفظ</button><button class="btn g" onclick="closeM()">إلغاء</button></div></div>')
}

async function attSaveEdit(id){
  if(!isAttAdmin())return;
  var r=D.attendance.filter(function(x){return x.id==id})[0];if(!r)return;
  var status=$("att_e_status").value,notes=$("att_e_notes").value.trim();
  var ok=await put("attendance",Object.assign({},r,{status:status,notes:notes,updated_at:Date.now()}));
  if(ok){act("👥 عدّل حضور «"+r.member_name+"» في "+r.meeting_date+" إلى "+ATT_STATUS[status]);closeM();toast("تم الحفظ ✓")}
}

async function attDel(id){
  if(!isAttAdmin()){toast("الحذف مقتصر على المصرح لهم فقط");return}
  var r=D.attendance.filter(function(x){return x.id==id})[0];if(!r)return;
  if(!confirm("حذف سجل حضور «"+r.member_name+"» في "+r.meeting_date+"؟ لا يمكن التراجع."))return;
  var ok=await rm("attendance",id);
  if(ok){act("👥 حذف سجل حضور «"+r.member_name+"» في "+r.meeting_date);toast("تم الحذف بنجاح ✓")}
}

/* ---------- telemetry validation (one unified structure for every provider) ---------- */
function rbIsN(v,lo,hi){return typeof v==="number"&&isFinite(v)&&v>=lo&&v<=hi}
function rbObj(v,p,E){if(v==null)return{};if(typeof v!=="object"||Array.isArray(v)){E.push(p+" must be an object");return{}}return v}
function rbNum(o,k,lo,hi,p,E){var v=o[k];if(v==null)return null;if(!rbIsN(v,lo,hi)){E.push(p+"."+k+" out of range ("+lo+".."+hi+")");return null}return v}
function rbBool(o,k,p,E){var v=o[k];if(v==null)return null;if(typeof v!=="boolean"){E.push(p+"."+k+" must be boolean");return null}return v}
function rbEnum(o,k,list,p,E){var v=o[k];if(v==null)return null;if(list.indexOf(v)<0){E.push(p+"."+k+" invalid");return null}return v}
function rbValidate(raw,src){
 var E=[],o=raw;
 if(!o||typeof o!=="object"||Array.isArray(o))return{ok:false,err:"payload is not a JSON object"};
 var b=o.battery;
 if(!b||typeof b!=="object"||!rbIsN(b.pct,0,100))return{ok:false,err:"battery.pct is required (0..100)"};
 if(RBSTATES.indexOf(o.state)<0)return{ok:false,err:"state is required: "+RBSTATES.join("|")};
 var mot=function(m,p){m=rbObj(m,p,E);return{status:rbEnum(m,"status",["running","stopped","fault"],p,E),speed:rbNum(m,"speed",-100,100,p,E)}};
 var dev=function(m,p){m=rbObj(m,p,E);return{status:rbEnum(m,"status",["on","off","fault"],p,E),power:rbNum(m,"power",0,100,p,E)}};
 var mo=rbObj(o.motors,"motors",E),sn=rbObj(o.sensors,"sensors",E),ob=rbObj(sn.obstacle,"sensors.obstacle",E),cl=rbObj(sn.cliff,"sensors.cliff",E);
 var er=[];
 if(o.errors!=null){if(!Array.isArray(o.errors)||o.errors.length>16)E.push("errors must be an array (max 16)");else o.errors.forEach(function(c){if(typeof c!=="string"||!/^[A-Za-z0-9_.-]{1,32}$/.test(c))E.push("errors[] invalid code");else er.push(c)})}
 var T={src:src,ts:Date.now(),devTs:rbIsN(o.ts,0,1e15)?o.ts:null,state:o.state,
  battery:{pct:b.pct,volt:rbNum(b,"volt",0,60,"battery",E),charging:rbBool(b,"charging","battery",E)},
  motors:{left:mot(mo.left,"motors.left"),right:mot(mo.right,"motors.right")},
  obstacle:{left:rbNum(ob,"left",0,500,"obstacle",E),front:rbNum(ob,"front",0,500,"obstacle",E),right:rbNum(ob,"right",0,500,"obstacle",E)},
  cliff:{left:rbBool(cl,"left","cliff",E),front:rbBool(cl,"front","cliff",E),right:rbBool(cl,"right","cliff",E)},
  ultrasonic:rbNum(sn,"ultrasonic",0,500,"sensors",E),
  suction:dev(o.suction,"suction"),brush:dev(o.brush,"brush"),
  dust:rbNum(o,"dust",0,100,"root",E),errors:er,
  docked:rbBool(o,"docked","root",E),progress:rbNum(o,"progress",0,100,"root",E),rssi:rbNum(o,"rssi",-120,0,"root",E),returnDist:null};
 if(E.length)return{ok:false,err:E.slice(0,4).join("; ")};
 return{ok:true,t:T}}

/* ---------- connection-settings checks ---------- */
function rbSrv(){var s=RBC.server.trim();if(!s)return"";if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(s))s="http://"+s;return s.replace(/\/+$/,"")}
function rbCheck(k){
 if(!/^[A-Za-z0-9_-]{1,48}$/.test(RBC.deviceId))return"ESP32 Device ID مطلوب (أحرف وأرقام و - و _ فقط، حتى 48)";
 if(!(RBC.timeout>=2&&RBC.timeout<=60))return"Connection Timeout يجب أن يكون بين 2 و 60 ثانية";
 var u;
 if(k==="mqtt"){
  try{u=new URL(RBC.broker)}catch(e){return"MQTT Broker URL غير صالح (مثال: wss://broker.example.com/mqtt)"}
  if(u.protocol!=="ws:"&&u.protocol!=="wss:")return"المتصفح يتصل بالـ broker عبر WebSocket فقط: استخدم ws:// أو wss:// (mqtt:// و tcp:// غير ممكنة من المتصفح)";
  if(location.protocol==="https:"&&u.protocol==="ws:"&&!rbLocal(u.hostname))return"الصفحة على HTTPS: استخدم wss:// (ws:// يُحجب كمحتوى مختلط)";
  if(!u.port&&!(+RBC.port>=1&&+RBC.port<=65535))return"MQTT Port غير صالح (1–65535)";
  if(!RBC.topic||RBC.topic.length>128||/[#+\s]/.test(RBC.topic)||RBC.topic.charAt(0)==="$")return"MQTT Topic غير صالح (بدون # أو + أو مسافات)";
  return""}
 var ep=RBC.endpoint||"";
 if(!/^(\/|https?:\/\/)/i.test(ep))return"HTTP API Endpoint يجب أن يبدأ بـ / أو http(s)://";
 var full=/^https?:\/\//i.test(ep)?ep:rbSrv();
 if(!full)return"ESP32 IP Address / Server URL مطلوب";
 try{u=new URL(full)}catch(e){return"Server URL غير صالح"}
 if(u.protocol!=="http:"&&u.protocol!=="https:")return"Server URL يجب أن يكون http:// أو https://";
 if(location.protocol==="https:"&&u.protocol==="http:"&&!rbLocal(u.hostname))return"الصفحة على HTTPS: المتصفح يحجب طلبات http:// (محتوى مختلط). استخدم https:// أو افتح الصفحة محليًا";
 return""}

 if(m=="cleaning"){s.dock=false;s.chg=false;s.mL=Math.round(58+r()*8);s.mR=Math.round(58+r()*8);s.suc=80;s.brs=70;s.bat=Math.max(0,s.bat-0.25);s.bin=Math.min(100,s.bin+0.6);s.prog=Math.min(100,s.prog+0.8);
  s.front=r()<.12?Math.round(6+r()*10):Math.round(40+r()*100);s.left=Math.round(20+r()*100);s.right=Math.round(20+r()*100);s.cliff=r()<.015;s.bump=s.front<8;
  if(s.front<16)rbLog("demo","عائق أمامي على "+s.front+" سم — تغيير الاتجاه");
  if(s.cliff){rbLog("demo","اكتشاف حافة — توقف وتراجع");s.mL=s.mR=-30}
  s.stuck=s.front<8?s.stuck+1:0;
  if(s.stuck>=4)rbFault(s,"E_STUCK","الروبوت عالق بجانب عائق");
  else if(s.bat<=5)rbFault(s,"E_BAT_EMPTY","نفاد البطارية");
  else if(s.bin>=95){rbLog("demo","حاوية الأتربة ممتلئة — عودة للمحطة");rbGo(s)}
  else if(s.bat<=20){rbLog("demo","بطارية منخفضة ("+Math.round(s.bat)+"٪) — عودة للمحطة");rbGo(s)}
  else if(s.prog>=100){rbLog("demo","اكتمل التنظيف — عودة للمحطة");rbGo(s)}}
 else if(m=="returning"){s.mL=s.mR=45;s.suc=s.brs=0;s.cliff=s.bump=false;s.front=Math.round(60+r()*80);s.bat=Math.max(0,s.bat-0.12);s.dist=Math.max(0,s.dist-1);
  if(s.bat<=5)rbFault(s,"E_BAT_EMPTY","نفاد البطارية أثناء العودة");
  else if(s.dist<=0){s.dock=true;s.mL=s.mR=0;s.mode="charging";s.chg=true;rbLog("demo","وصل إلى المحطة — بدء الشحن وتفريغ الأتربة")}}
 else if(m=="charging"){s.mL=s.mR=s.suc=s.brs=0;s.chg=true;s.bat=Math.min(100,s.bat+0.8);
  if(s.bin>0){s.bin=Math.max(0,s.bin-15);if(s.bin==0)rbLog("demo","تم تفريغ الأتربة في المحطة")}
  if(s.bat>=100){s.bat=100;s.chg=false;s.mode="idle";rbLog("demo","اكتمل الشحن — الروبوت جاهز")}}
 else{s.mL=s.mR=s.suc=s.brs=0;s.chg=false;s.cliff=s.bump=false;s.bat=Math.max(0,s.bat-(m=="idle"?0.01:0))}}
function rbSimCmd(s,c){
 if(s.mode==="error"&&c!=="reset")return"يوجد عطل — نفّذ Reset / Clear Error أولًا";
 if(c==="start"){if(s.mode==="cleaning")return"التنظيف يعمل بالفعل";if(s.bat<20)return"البطارية منخفضة ("+Math.round(s.bat)+"٪) — اشحن أولًا";if(s.bin>=90)return"حاوية الأتربة ممتلئة — ارجع للمحطة لتفريغها";if(s.dock)s.prog=0;s.mode="cleaning";rbLog("demo","▶ بدء التنظيف");return""}

 if(c==="reset"){if(s.mode!=="error")return"لا يوجد خطأ لمسحه";s.mode="idle";s.err="";s.code="";s.stuck=0;rbLog("demo","🔄 تم مسح الخطأ");return""}
 return"أمر غير معروف"}
function rbUni(s){var mot=function(v){return{status:s.mode==="error"?"fault":(v?"running":"stopped"),speed:v}};
 return{src:"demo",ts:Date.now(),devTs:null,state:s.mode,
  battery:{pct:s.bat,volt:Math.round((6+s.bat/100*2.4)*100)/100,charging:s.chg},
  motors:{left:mot(s.mL),right:mot(s.mR)},
  obstacle:{left:s.left,front:s.front,right:s.right},cliff:{left:false,front:s.cliff,right:false},ultrasonic:s.front,
  suction:{status:s.suc?"on":"off",power:s.suc},brush:{status:s.brs?"on":"off",power:s.brs},
  dust:s.bin,errors:s.code?[s.code]:[],docked:s.dock,progress:s.prog,rssi:s.rssi,returnDist:s.mode==="returning"?s.dist:null}}

/* ---------- DataProvider interface ---------- */
class DataProvider{
 constructor(kind,label){this.kind=kind;this.label=label;this.conn="offline";this.err="";this.detail="";this.lastOk=0;this.lastData=0;this.telemetry=null;this.rejected=0;this.attempt=0;this.active=false}
 /* The ONLY thing the UI reads. Real telemetry is never exposed unless the link is Online. */
 get snapshot(){var cur=this.kind==="demo"||this.conn==="online";return{kind:this.kind,label:this.label,conn:this.conn,err:this.err,detail:this.detail,lastOk:this.lastOk,lastData:this.lastData,rejected:this.rejected,attempt:this.attempt,active:this.active,telemetry:cur?this.telemetry:null}}
 setConn(c,err,detail){var ch=c!==this.conn;this.conn=c;this.err=err||"";if(detail!==undefined)this.detail=detail;if(ch)rbLog("real",RBL[c]+(err?" — "+err:""));rbNotify()}
 ingest(raw){var v=rbValidate(raw,this.kind);
  if(!v.ok){this.rejected++;if(this.rejected<=3||this.rejected%20===0)rbLog("real","⚠ رسالة مرفوضة (لم تُعرض): "+v.err);rbNotify();return false}
  this.telemetry=v.t;this.lastData=this.lastOk=v.t.ts;
  if(this.conn!=="online")this.setConn("online","","");else rbNotify();return true}
 tick(){if(this.conn==="online"&&Date.now()-this.lastData>RBC.timeout*1000)this.setConn("offline","لا توجد بيانات من الـ ESP32 منذ أكثر من "+RBC.timeout+" ث — القراءات القديمة أُخفيت","")}
 async connect(){throw new Error("not implemented")}
 async disconnect(){}
 async test(){return{ok:false,msg:"not implemented"}}
 async sendCommand(rec){rec.status="failed";rec.err="not implemented"}}

class DemoDataProvider extends DataProvider{
 constructor(){super("demo","Demo (Simulation)");this.conn="demo";this.sim=rbInit();this.telemetry=rbUni(this.sim);this.lastData=Date.now()}
 tick(){rbStep(this.sim);this.telemetry=rbUni(this.sim);this.lastData=Date.now()}
 async connect(){}
 async sendCommand(rec){
  if(RB.mode!=="demo"){rec.status="failed";rec.err="Demo provider inactive";return}
  var m=rbSimCmd(this.sim,rec.cmd);rec.status="sent";this.telemetry=rbUni(this.sim);rbNotify();
  setTimeout(function(){rec.status=m?"failed":"acknowledged";rec.err=m;if(m)toast(m);rbNotify()},350)}}

class MqttDataProvider extends DataProvider{
 constructor(){super("mqtt","MQTT");this.cl=null;this.waits={};this.brokerOk=false;this.everConn=false;this.t0=0;this.lastErr=""}
 topics(){var base=RBC.topic.split("{device_id}").join(RBC.deviceId);return{tel:base+"/telemetry",st:base+"/status",cmd:base+"/commands",cfg:base+"/config"}}
 url(){var u=new URL(RBC.broker);if(!u.port&&RBC.port)u.port=String(+RBC.port);return u.toString()}
 opts(x){var o={clientId:"tracker_"+Math.random().toString(16).slice(2,10),clean:true,keepalive:30,connectTimeout:RBC.timeout*1000,reconnectPeriod:3000};if(RBC.user)o.username=RBC.user;if(RB.pw)o.password=RB.pw;return Object.assign(o,x||{})}
 failWaits(why){for(var k in this.waits){var w=this.waits[k];clearTimeout(w.tm);w.rec.status="failed";w.rec.err=why}this.waits={}}
 kill(){var c=this.cl;this.cl=null;this.brokerOk=false;this.failWaits("Disconnected");if(c){try{c.end(true)}catch(e){}}}
 async connect(){
  this.kill();var chk=rbCheck("mqtt");
  if(chk){this.active=false;this.setConn("error",chk,"");return}
  if(!window.mqtt){this.active=false;this.setConn("error","مكتبة MQTT لم تُحمَّل (cdn.jsdelivr.net محجوب أو لا يوجد إنترنت)","");return}
  this.active=true;this.attempt=0;this.telemetry=null;this.lastData=0;this.everConn=false;this.lastErr="";
  this.setConn("connecting","","Connecting to broker…");
  var T=this.topics(),self=this,c;
  try{c=mqtt.connect(this.url(),this.opts())}catch(e){this.active=false;this.setConn("error",rbMsg(e),"");return}
  this.cl=c;
  c.on("connect",function(){if(self.cl!==c)return;self.brokerOk=true;self.everConn=true;self.attempt=0;self.t0=Date.now();self.lastOk=Date.now();
   self.setConn("connecting","","Broker connected — subscribing…");
   c.subscribe([T.tel,T.st],{qos:1},function(err,g){if(self.cl!==c)return;
    if(err||(g&&g.some(function(x){return x.qos===128}))){self.setConn("error","Subscribe failed: "+(err?rbMsg(err):"denied by broker ACL"),"")}
    else self.setConn(self.conn==="online"?"online":"connecting","","Broker connected & subscribed — waiting for ESP32 telemetry")})});
  c.on("message",function(topic,payload,pkt){if(self.cl!==c)return;
   var j=null;try{var s=payload.toString();if(s.length<=16384)j=JSON.parse(s)}catch(e){j=null}
   if(topic===T.tel){if(pkt&&pkt.retain){rbLog("real","تجاهل رسالة telemetry محفوظة (retained) — قد تكون قديمة");return}self.ingest(j)}
   else if(topic===T.st&&j&&typeof j==="object"){self.lastOk=Date.now();
    if(j.type==="ack"&&typeof j.id==="string"){var w=self.waits[j.id];if(w){clearTimeout(w.tm);delete self.waits[j.id];w.rec.status=j.ok===false?"failed":"acknowledged";w.rec.err=j.ok===false?String(j.error||"rejected by ESP32").slice(0,120):"";rbNotify()}}
    else if(j.online===false)self.setConn("offline","ESP32 أبلغ أنه غير متصل (status topic)","")}});
  c.on("error",function(e){if(self.cl!==c)return;self.lastErr=rbMsg(e);if(!self.everConn)self.setConn("error",self.lastErr,"")});
  c.on("close",function(){if(self.cl!==c)return;self.brokerOk=false;self.failWaits("Connection lost");
   if(!self.everConn)self.setConn("error",self.lastErr||"تعذّر الوصول للـ broker (عنوان/منفذ خاطئ، الـ broker متوقف، أو محجوب بسياسة أمان المتصفح)","");
   else self.setConn("offline",self.lastErr||"انقطع الاتصال بالـ broker","")});
  c.on("reconnect",function(){if(self.cl!==c)return;self.attempt++;
   if(self.attempt>20){var e=self.lastErr;self.kill();self.active=false;self.setConn("error","توقفت المحاولات بعد 20 محاولة إعادة اتصال"+(e?" — "+e:""),"");return}
   self.detail="Reconnecting… attempt "+self.attempt;rbNotify()})}
 tick(){super.tick();if(this.conn==="connecting"&&this.brokerOk&&this.t0&&Date.now()-this.t0>RBC.timeout*1000)this.setConn("offline","الـ broker متصل لكن لم تصل أي بيانات صالحة من الـ ESP32 خلال "+RBC.timeout+" ث","Waiting for telemetry…")}
 async disconnect(){this.kill();this.active=false;this.telemetry=null;this.setConn("offline","","")}
 async test(){
  var chk=rbCheck("mqtt");if(chk)return{ok:false,msg:chk};
  if(!window.mqtt)return{ok:false,msg:"مكتبة MQTT لم تُحمَّل"};
  var self=this;
  return new Promise(function(res){var c,done=false,t0=Date.now(),tm;
   var fin=function(ok,msg){if(done)return;done=true;clearTimeout(tm);try{if(c)c.end(true)}catch(e){}res({ok:ok,msg:msg})};
   tm=setTimeout(function(){fin(false,"انتهت المهلة ("+RBC.timeout+" ث) — الـ broker لم يرد")},RBC.timeout*1000+500);
   try{c=mqtt.connect(self.url(),self.opts({reconnectPeriod:0}))}catch(e){return fin(false,rbMsg(e))}
   c.on("connect",function(){fin(true,"الـ broker قبل الاتصال ("+(Date.now()-t0)+" ms). لم يتم التحقق من وجود ESP32 أو بياناته.")});
   c.on("error",function(e){fin(false,rbMsg(e))});
   c.on("close",function(){fin(false,"أُغلق الاتصال قبل أن يكتمل (عنوان/منفذ خاطئ، أو محجوب بسياسة أمان المتصفح)")})})}
 async sendCommand(rec){
  var c=this.cl,self=this;
  if(this.conn!=="online"||!c||!c.connected){rec.status="failed";rec.err="ESP32 not Online";rbNotify();return}
  var T=this.topics();
  var w={rec:rec,tm:setTimeout(function(){if(self.waits[rec.id]){delete self.waits[rec.id];rec.status="failed";rec.err="لا يوجد تأكيد من الـ ESP32 خلال "+RBC.timeout+" ث";rbNotify()}},RBC.timeout*1000)};
  this.waits[rec.id]=w;
  return new Promise(function(res){
   c.publish(T.cmd,JSON.stringify({id:rec.id,cmd:rec.cmd,ts:Date.now()}),{qos:1},function(err){
    if(err){clearTimeout(w.tm);delete self.waits[rec.id];rec.status="failed";rec.err=rbMsg(err)}
    else if(rec.status==="pending")rec.status="sent";
    rbNotify();res()})})}}

class HttpDataProvider extends DataProvider{
 constructor(){super("http","HTTP API");this.run=0;this.tm=null;this.healthy=false;this.fails=0}
 url(p){var ep=RBC.endpoint.split("{device_id}").join(encodeURIComponent(RBC.deviceId)),full=/^https?:\/\//i.test(ep)?ep:rbSrv()+ep;return full.replace(/\/+$/,"")+p}
 async req(path,o){var ac=new AbortController(),ms=RBC.timeout*1000,t=setTimeout(function(){ac.abort()},ms);
  try{var r=await fetch(this.url(path),Object.assign({signal:ac.signal,cache:"no-store",credentials:"omit"},o||{}));
   if(!r.ok)throw new Error("HTTP "+r.status+(r.statusText?" "+r.statusText:""));return r}
  catch(e){if(e&&e.name==="AbortError")throw new Error("انتهت المهلة ("+RBC.timeout+" ث)");if(e instanceof TypeError)throw new Error("خطأ شبكة — العنوان غير قابل للوصول، أو CORS / محتوى مختلط / سياسة أمان الصفحة تحجب الطلب");throw e}
  finally{clearTimeout(t)}}
 stop(){this.run++;clearTimeout(this.tm)}
 async connect(){
  this.stop();var chk=rbCheck("http");
  if(chk){this.active=false;this.setConn("error",chk,"");return}
  this.active=true;this.attempt=0;this.fails=0;this.healthy=false;this.telemetry=null;this.lastData=0;
  this.setConn("connecting","","Checking /health …");this.loop(this.run)}
 async loop(id){while(id===this.run){var ok=await this.cycle(id);if(id!==this.run)return;
  var d=ok?2000:Math.min(10000,Math.round(2000*Math.pow(1.6,this.fails)));
  await new Promise(r=>{this.tm=setTimeout(r,d)})}}
 async cycle(id){
  try{
   if(!this.healthy){await this.req("/health",{headers:{Accept:"application/json"}});if(id!==this.run)return false;this.healthy=true;this.lastOk=Date.now();
    if(this.conn!=="online")this.setConn("connecting","","Health OK — waiting for telemetry…")}
   var r=await this.req("/telemetry",{headers:{Accept:"application/json"}}),j=null;
   try{j=await r.json()}catch(e){}
   if(id!==this.run)return false;
   this.lastOk=Date.now();this.fails=0;this.attempt=0;this.ingest(j);return true}
  catch(e){
   if(id!==this.run)return false;
   this.healthy=false;this.fails++;this.attempt=this.fails;var m=rbMsg(e);
   if(this.fails>=20){this.stop();this.active=false;this.setConn("error","توقفت المحاولات بعد 20 فشلًا — "+m,"");return false}
   if(this.conn==="online"&&this.fails<2){this.detail="Retrying…";rbNotify();return false}
   if(this.lastData>0)this.setConn("offline",m,"Retrying…");else this.setConn("error",m,"Retrying…");
   return false}}
 async disconnect(){this.stop();this.active=false;this.telemetry=null;this.setConn("offline","","")}
 async test(){
  var chk=rbCheck("http");if(chk)return{ok:false,msg:chk};
  var t0=Date.now();
  try{var r=await this.req("/health",{headers:{Accept:"application/json"}});return{ok:true,msg:"نقطة /health ردّت HTTP "+r.status+" خلال "+(Date.now()-t0)+" ms. لم يتم التحقق من بيانات الـ ESP32."}}
  catch(e){return{ok:false,msg:rbMsg(e)}}}
 async sendCommand(rec){
  if(this.conn!=="online"){rec.status="failed";rec.err="ESP32 not Online";rbNotify();return}
  try{
   var r=await this.req("/commands",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({id:rec.id,cmd:rec.cmd,ts:Date.now()})});
   rec.status="sent";rbNotify();
   var j=null;try{j=await r.json()}catch(e){}
   if(j&&j.id===rec.id&&typeof j.ack==="boolean"){rec.status=j.ack?"acknowledged":"failed";rec.err=j.ack?"":String(j.error||"rejected by ESP32").slice(0,120);rbNotify();return}
   var end=Date.now()+RBC.timeout*1000;
   while(Date.now()<end){await rbSleep(1000);var s=await(await this.req("/status",{headers:{Accept:"application/json"}})).json(),lc=s&&s.last_cmd;
    if(lc&&lc.id===rec.id){rec.status=lc.ok===false?"failed":"acknowledged";rec.err=lc.ok===false?String(lc.error||"rejected by ESP32").slice(0,120):"";rbNotify();return}}
   rec.status="failed";rec.err="لا يوجد تأكيد من الـ ESP32 خلال "+RBC.timeout+" ث";rbNotify()}
  catch(e){rec.err=(rec.status==="sent"?"فشل التحقق من التأكيد: ":"")+rbMsg(e);rec.status="failed";rbNotify()}}}

var RBDOC=`MQTT topics (base = "MQTT Topic", default robot/{device_id})
  {base}/telemetry   ESP32 -> page   JSON, not retained
  {base}/status      ESP32 -> page   {"online":false} | {"type":"ack","id":"<cmd id>","ok":true|false,"error":"..."}
  {base}/commands    page  -> ESP32  {"id":"<cmd id>","cmd":"start|stop|dock|reset","ts":<ms>}  (QoS 1)
  {base}/config      reserved (not used yet)

HTTP API (endpoint default /api/robot/{device_id})
  GET  /telemetry    -> telemetry JSON (polled every 2 s)
  GET  /status       -> {"last_cmd":{"id":"...","ok":true|false}}
  POST /commands     {"id","cmd","ts"} -> 2xx; optional body {"id","ack":true|false}
  GET  /health       -> 200 when the device/API is alive

Telemetry JSON (format only — types/ranges, NOT data). Required: battery.pct, state
{
  "battery": {"pct":0-100, "volt":0-60, "charging":bool},
  "motors":  {"left":{"status":"running|stopped|fault","speed":-100..100}, "right":{...}},
  "sensors": {"obstacle":{"left":cm,"front":cm,"right":cm},   // 0-500
              "cliff":{"left":bool,"front":bool,"right":bool}, // true = cliff detected
              "ultrasonic":cm},
  "suction": {"status":"on|off|fault","power":0-100},
  "brush":   {"status":"on|off|fault","power":0-100},
  "dust":0-100,
  "state":"idle|cleaning|returning|charging|error",
  "errors":["E_CODE", ...],
  "docked":bool, "progress":0-100, "rssi":dBm, "ts":<device ms>   // optional
}
Invalid messages are rejected (counted + logged) and never shown.`;

/* أداء أعضاء الفريق */
function vipMemberPerf(){
 return everyone().map(function(n){
  var tk=D.tasks.filter(function(t){return t.o==n});
  var done=tk.filter(function(t){return t.s=="d"}).length;
  var attRecs=D.attendance.filter(function(r){return r.member_name==n});
  var present=attRecs.filter(function(r){return r.status=="present"||r.status=="late"}).length;
  var attRate=attRecs.length?Math.round(present*100/attRecs.length):null;
  return{name:n,tasks:tk.length,done:done,pct:pc(done,tk.length),attRate:attRate,attRecs:attRecs.length}
 }).sort(function(a,b){return b.pct-a.pct})
}

function vipSaveNote(text,target){

 notes.unshift({id:"n"+Date.now(),text:text,target:target||"",by:me,ts:Date.now()});

function vipSaveDecision(title,text){

 search:"",filterRole:"",filterStatus:"",

/* الحصول على دور العضو */
function tmRole(name){
 if(name===TM_SUPER_ADMIN)return{key:"dev",label:"Super Admin & Developer",badge:"dev"};
 if(TM_SUPERVISORS.indexOf(name)>=0)return{key:"sup",label:"Supervisor",badge:"sup"};
 return{key:"mem",label:"Team Member",badge:"mem"};
}

/* الحصول على emoji العضو */
function tmAvatar(name){
 if(name===TM_SUPER_ADMIN)return"👨‍💻";

}

/* صلاحيات Super Admin الكاملة (لا تُحفظ، دائماً كاملة) */
function tmSuperPerms(){
 var p={};
 TM_SECTIONS.forEach(function(s){s.perms.forEach(function(pr){p[pr.id]=true})});
 return p;
}

/* قراءة صلاحيات عضو من Supabase أو من cache */
async function tmLoadPerms(name){
 if(name===TM_SUPER_ADMIN)return tmSuperPerms();
 if(TM.permsCache[name])return TM.permsCache[name];
 // محاولة قراءة من Supabase
 if(SBR()&&SB.c){
  try{
   var r=await SB.c.from("team_permissions").select("permissions").eq("member_name",name).single();
   if(r.data&&r.data.permissions){
    TM.permsCache[name]=r.data.permissions;
    return TM.permsCache[name];
   }
  }catch(e){}
 }
 // افتراضي: صلاحيات مشرف كاملة، عضو عادي - قراءة فقط
 var def={};
 TM_SECTIONS.forEach(function(s){s.perms.forEach(function(pr){
  var role=tmRole(name);
  if(role.key==="sup"){def[pr.id]=true}
  else{def[pr.id]=pr.id.endsWith("_view")||pr.id.endsWith("_reports")||pr.id.endsWith("_total")||pr.id.endsWith("_logs")||pr.id==="att_view"||pr.id==="tasks_view"||pr.id==="tasks_status"}
 })});
 TM.permsCache[name]=def;
 return def;
}

/* حفظ الصلاحيات */
async function tmSavePerms(name,perms){
 if(name===TM_SUPER_ADMIN){toast("لا يمكن تعديل صلاحيات Super Admin");return false}
 TM.permsCache[name]=perms;
 if(SBR()&&SB.c){
  try{
   var r=await SB.c.from("team_permissions").upsert({
    member_name:name,
    permissions:perms,
    updated_by:me||"",
    updated_at:new Date().toISOString()
   },{onConflict:"member_name"});
   if(r.error)throw r.error;
   // تسجيل في السجل
   var total=Object.values(perms).filter(Boolean).length;
   act("🔑 حدّث صلاحيات «"+name+"» ("+total+" صلاحية)");
   return true;
  }catch(e){
   toast("تحذير: تعذّر حفظ الصلاحيات في Supabase — "+e.message);
   act("🔑 حدّث صلاحيات «"+name+"» (محلياً)");
   return true; // محفوظ محلياً
  }
 }
 act("🔑 حدّث صلاحيات «"+name+"» (محلياً)");
 return true;
}

 return Object.values(perms).filter(Boolean).length;

function tmTotalPerms(){
 var n=0;TM_SECTIONS.forEach(function(s){n+=s.perms.length});return n;

/* فلترة الأعضاء */
function tmFiltered(){
 var members=everyone().map(function(n){return{name:n}});
 return members.filter(function(m){
  if(TM.search&&m.name.toLowerCase().indexOf(TM.search.toLowerCase())<0)return false;

 });

 try{
  var r=await fetch("/api/admin",{method:"POST",
   headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
   body:JSON.stringify(body)});
  var j={};try{j=await r.json()}catch(e){}
  if(!r.ok){toast("⚠️ "+( j.error||"خطأ "+r.status));return null}
  return j;
 }catch(e){toast("تعذّر الاتصال بالخادم: "+(e.message||e));return null}
}

/* ---- إيقاف / تفعيل الحساب ---- */
async function tmToggleAccount(name, activate){
 if(!confirm((activate?"تفعيل":"إيقاف")+" حساب «"+name+"»؟\n"+(activate?"سيتمكن من تسجيل الدخول مجدداً.":"لن يتمكن من تسجيل الدخول حتى تُعيد تفعيله.")))return;
 var btn=event&&event.target;if(btn){btn.disabled=true;btn.textContent="جاري..."}
 var res=await tmAdminCall(activate?"unban":"ban",name);
 if(res&&res.ok){
  act((activate?"✅ تفعيل":"⛔ إيقاف")+" حساب «"+name+"»");
  toast(res.message||"تم ✓");
  closeM();
  // تحديث حالة الحساب في الجدول
  delete TM_ACCT_STATUS[name];
  go();
 }else{if(btn){btn.disabled=false;btn.textContent=activate?"تفعيل الحساب":"إيقاف الحساب"}}
}

function tmTogglePw(id){
 var el=document.getElementById(id);
 if(el)el.type=el.type==="password"?"text":"password";
}

async function tmConfirmSetPassword(name){
 var pw=document.getElementById("tm-pw-new");
 var pw2=document.getElementById("tm-pw-confirm");
 var msg=document.getElementById("tm-pw-msg");
 var btn=document.getElementById("tm-pw-btn");
 if(!pw||!pw2||!msg||!btn)return;
 var val=pw.value,val2=pw2.value;
 msg.textContent="";
 if(val.length<6){msg.textContent="كلمة المرور يجب أن تكون 6 أحرف على الأقل";pw.focus();return}
 if(val!==val2){msg.textContent="كلمتا المرور غير متطابقتين";pw2.focus();return}
 if(!confirm("تأكيد تغيير كلمة مرور «"+name+"»؟ تأكد من إبلاغه بكلمة المرور الجديدة."))return;
 btn.disabled=true;btn.textContent="جاري التغيير...";
 var res=await tmAdminCall("set_password",name,{newPassword:val});
 if(res&&res.ok){
  act("🔑 غيّر كلمة مرور «"+name+"»");
  toast(res.message||"تم تغيير كلمة المرور ✓");
  // مسح الحقول فوراً
  pw.value="";pw2.value="";
  closeM();
 }else{
  btn.disabled=false;btn.textContent="💾 تغيير كلمة المرور";
 }
}

/* ---- SQL Migration للصلاحيات ---- */
function tmShowMigration(){
 var sql=`-- Team Permissions Table Migration
-- Run this in Supabase SQL Editor

CREATE TABLE IF NOT EXISTS public.team_permissions (
  id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
  member_name text NOT NULL UNIQUE,
  permissions jsonb NOT NULL DEFAULT '{}',
  updated_by text,
  updated_at timestamptz DEFAULT now(),
  created_at timestamptz DEFAULT now()
);

-- Enable RLS
ALTER TABLE public.team_permissions ENABLE ROW LEVEL SECURITY;

-- Policy: Authenticated users can read permissions
CREATE POLICY "auth_read_permissions"
  ON public.team_permissions FOR SELECT
  TO authenticated USING (true);

-- Policy: Only admins can insert/update (via service role)
-- For anon key: allow insert/update from authenticated
CREATE POLICY "auth_write_permissions"
  ON public.team_permissions FOR ALL
  TO authenticated USING (true) WITH CHECK (true);

-- Index for fast lookup
CREATE INDEX IF NOT EXISTS idx_team_perms_member
  ON public.team_permissions (member_name);`;

 modal('<div class="tm-modal">'
  +'<div class="tm-modal-head"><span style="font-size:22px">🗄️</span><h3>SQL Migration — جدول الصلاحيات</h3></div>'
  +'<div class="tm-modal-body">'
  +'<div class="tm-alert info">انسخ هذا الكود وشغّله في Supabase SQL Editor لإنشاء جدول الصلاحيات.</div>'
  +'<pre dir="ltr" style="background:#0a1433;border:1px solid #1e3a8a;border-radius:10px;padding:14px;font-size:12px;line-height:1.6;overflow-x:auto;white-space:pre-wrap;color:#e2e8f0">'+esc(sql)+'</pre>'
  +'</div>'
  +'<div class="tm-modal-foot"><button class="btn" onclick="tmCopySql()">📋 نسخ الكود</button><button class="tm-cancel" onclick="closeM()">إغلاق</button></div>'
  +'</div>');
 // store sql for copy
 window._tmSql=sql;
}
function tmCopySql(){if(navigator.clipboard&&window._tmSql){navigator.clipboard.writeText(window._tmSql).then(function(){toast("تم نسخ الكود ✓")})}}

function tmBuildTable(filtered){
 if(!filtered.length)return'<div class="tm-empty"><div class="tm-empty-icon">🔍</div><p>لا توجد نتائج مطابقة للبحث.</p></div>';

 var rows=filtered.map(function(m){
  var name=m.name;
  var role=tmRole(name);
  var avatar=tmAvatar(name);
  var isSuper=name===TM_SUPER_ADMIN;
  var tasks=D.tasks.filter(function(t){return t.o===name});
  var cachedPerms=TM.permsCache[name]||(isSuper?tmSuperPerms():null);
  var pcount=cachedPerms?tmPermCount(cachedPerms):"—";

  return '<tr>'
   +'<td><div class="tm-name-cell"><div class="tm-avatar '+role.key+'">'+avatar+'</div><div><b>'+esc(name)+'</b><small>'+esc(role.label)+'</small></div></div></td>'
   +'<td><span class="tm-role-badge '+role.key+'">'+(role.key==="dev"?"⚡ Super Admin":role.key==="sup"?"👑 Supervisor":"👤 Team Member")+'</span></td>'
   +'<td><span class="tm-status-dot active">نشط</span></td>'
   +'<td>'+fm(tasks.length)+' مهمة</td>'
   +'<td>'+(pcount==="—"?'<span class="note">جارٍ التحميل...</span>':pcount+' / '+tmTotalPerms())+'</td>'
   +'<td><div class="tm-action-btns">'
   +'<button class="tm-btn info" onclick="tmViewMember(\''+esc(name)+'\')">👁 تفاصيل</button>'
   +(canManageTeam()&&!isSuper?'<button class="tm-btn perm" onclick="tmPermModal(\''+esc(name)+'\')">🔑 صلاحيات</button>'
    +(isSuper?'':'<button class="tm-btn acct" onclick="tmAccountModal(\''+esc(name)+'\')">⚙️ حساب</button>'):'')
   +'</div></td>'
   +'</tr>';
 }).join("");

 return '<div class="wrap"><table class="tm-tbl">'
  +'<thead><tr><th>العضو</th><th>الدور الوظيفي</th><th>حالة الحساب</th><th>المهام</th><th>الصلاحيات</th><th>الإجراءات</th></tr></thead>'
  +'<tbody>'+rows+'</tbody>'
  +'</table></div>';
}

function tmRefreshTable(){
 var el=document.getElementById("tm-table-body");
 if(el)el.innerHTML=tmBuildTable(tmFiltered());
}

// تحميل الصلاحيات في الخلفية عند فتح الصفحة
async function tmPreloadPerms(){
 var members=everyone();
 for(var i=0;i<members.length;i++){
  if(!TM.permsCache[members[i]]){
   await tmLoadPerms(members[i]);
   tmRefreshTable();
  }
 }
}
